[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "gflights"
version = "0.3.0"
description = "Unofficial async Python client for Google Flights, powered by a Rust backend"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
]

[dependency-groups]
dev = ["pytest>=9.0.3", "pytest-asyncio>=1.4.0", "maturin>=1.4,<2.0"]
# Live cross-validation dep: the PyPI package `flights` (punitarani/fli) provides
# the `fli` CLI that tests/test_live_compare_fli.py shells out to. Install with
# `uv pip install --group live` (or `uv sync --group live`).
# `click` is listed explicitly because flights 0.9.0's CLI imports it but omits
# it from its own dependencies, so `fli` fails to start without it.
live = ["flights>=0.9", "click>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: requires live network (set RUN_LIVE_TESTS=1 to run)",
]

[tool.maturin]
features = ["pyo3/extension-module"]
# Extension becomes gflights._gflights; the gflights/ Python package is included too.
module-name = "gflights._gflights"
python-packages = ["gflights"]
